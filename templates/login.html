{% extends 'base.html' %}

{% block content %}
<div class="auth-card">
    <h2>Login to BloodBank</h2>
    <form method="POST" action="{{ url_for('auth.login') }}">
        <div class="form-group">
            <label for="role_type">I am a:</label>
            <select name="role_type" id="role_type" class="form-control" required>
                <option value="patient">Receiver (Patient in Need)</option>
                <option value="donor">Donor</option>
                <option value="hospital">Hospital Representative</option>
                <option value="staff">Staff Member</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="username">Email, Phone, or License No:</label>
            <input type="text" name="username" id="username" class="form-control" required placeholder="Enter your identifier">
        </div>

        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" name="password" id="password" class="form-control" required>
            <small style="color:var(--light-text); display:block; margin-top:5px; line-height:1.4;">
                <strong>Demo Logins:</strong><br>
                Receiver: <code>555-0301</code> / <code>pat123</code><br>
                Donor: <code>555-0201</code> / <code>donor123</code><br>
                Hospital: <code>LIC-10001</code> / <code>hosp123</code><br>
                Staff: <code>alice.smith@bloodbank.com</code> / <code>admin123</code>
            </small>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Login</button>
    </form>
</div>
{% endblock %}
