{% extends 'base.html' %}

{% block content %}

<style>
    body {
        background: #ffffff url("{{ url_for('static', filename='img/hero-bg.png') }}") no-repeat left center;
        background-size: 50%;
        background-attachment: fixed;
    }
    .auth-wrapper {
        align-items: flex-end !important;
        padding-right: 15%;
    }
</style>

<div class="auth-wrapper" style="flex-direction: column; align-items: center; justify-content: flex-start; margin-top: 2rem;">

    <div style="max-width: 420px; width: 100%;">
        <h2 style="font-size: 1.8rem; margin-bottom: 0.5rem; text-align: center;">Register Account</h2>
        <p style="text-align: center; color: #000000; font-weight: bold; font-size: 0.9rem; margin-bottom: 2rem;">Create a new Receiver or Donor account.</p>

        <form method="POST" action="{{ url_for('auth.register') }}">
            <div class="form-group">
                <label style="font-size: 0.85rem; color: #000000; font-weight: bold;">Account Type:</label>
                <div class="role-pills-selector" style="display: flex; gap: 1rem; margin-top: 0.5rem; margin-bottom: 1.5rem;">
                    <div class="role-pill-btn selected" onclick="selectRegisterRole('patient', this)">Receiver</div>
                    <div class="role-pill-btn" onclick="selectRegisterRole('donor', this)">Donor</div>
                </div>
                <select name="role_type" id="reg_role_type" style="display: none;" required>
                    <option value="patient" selected>Receiver</option>
                    <option value="donor">Donor</option>
                </select>
            </div>

            <div class="form-group">
                <label for="name">Full Name:</label>
                <input type="text" name="name" id="name" class="form-control" required placeholder="Enter your full name" pattern="^[A-Za-z\s]+$" title="Name must contain only letters and spaces, no numbers">
            </div>

            <div class="form-group">
                <label for="phone">Phone Number:</label>
                <input type="text" name="phone" id="phone" class="form-control" required placeholder="Enter your phone number" pattern="^[0-9]{10}$" title="Phone number must be exactly 10 digits">
            </div>

            
            <div class="form-group">
                <label for="dob">Date of Birth:</label>
                <input type="date" name="dob" id="dob" class="form-control" required min="1900-01-01"  title="Please enter a valid date of birth">
            </div>

            <div class="form-group">
                <label for="blood_group">Blood Group:</label>
                <select name="blood_group" id="blood_group" class="form-control" required>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                </select>
            </div>

            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" name="password" id="password" class="form-control" required placeholder="Create a password">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.7rem;">
                <span>Register</span>
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
            <span style="color: #000000; font-weight: bold;">Already have an account?</span> 
            <a href="{{ url_for('auth.login') }}" style="color: var(--primary-color); font-weight: bold; text-decoration: underline;">Login here</a>
        </div>
    </div>
</div>

<script>
    function updateDateBounds(role) {
        const dobInput = document.getElementById('dob');
        const today = new Date();
        
        if (role === 'donor') {
            // Subtract 18 years
            const minAgeDate = new Date(today.getFullYear() - 18, today.getMonth(), today.getDate());
            dobInput.max = minAgeDate.toISOString().split('T')[0];
            dobInput.title = "Donors must be at least 18 years old.";
        } else {
            // Max is today
            dobInput.max = today.toISOString().split('T')[0];
            dobInput.title = "Please enter a valid date of birth.";
        }
        
        // If current value is invalid due to role switch, clear it
        if (dobInput.value && dobInput.value > dobInput.max) {
            dobInput.value = '';
        }
    }

    function selectRegisterRole(role, element) {
        document.getElementById('reg_role_type').value = role;
        document.querySelectorAll('.role-pill-btn').forEach(btn => btn.classList.remove('selected'));
        if(element) element.classList.add('selected');
        
        updateDateBounds(role);
    }
    
    document.addEventListener("DOMContentLoaded", () => {
        updateDateBounds(document.getElementById('reg_role_type').value);
    });
</script>
{% endblock %}
